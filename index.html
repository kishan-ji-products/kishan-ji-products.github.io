<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kishan Ji Products – Order</title>
<meta name="description" content="Kishan Ji Products price list – choose products and send your order.">
<meta property="og:title" content="Kishan Ji Products – Price list">
<meta property="og:description" content="See our products with photos and prices, and send your order.">
<style>
:root{--ink:#0e2240;--brass:#b4873a;--paper:#f3f5f8;--line:#e6e9ef;--muted:#5d6a7c;--bad:#b42318;--ok:#16834a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:#1d2939;font-size:15px}
header{background:#0b0b0b;color:#fff;padding:14px 16px 12px;border-bottom:2px solid var(--brass);position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:19px;letter-spacing:.6px;color:#e7c77f}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f.bad{border-color:#d92d20!important;box-shadow:0 0 0 3px rgba(217,45,32,.15)}.req-note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.mode-tag{display:inline-block;margin:-4px 0 10px;background:#0e2240;color:#e7c77f;font-weight:700;font-size:12.5px;letter-spacing:.3px;border-radius:999px;padding:4px 12px}
header .logo{display:block;height:40px;width:auto;max-width:80vw}
header p{margin-top:4px!important}
header p{margin:2px 0 0;font-size:12.5px;color:#c9c9c9}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px 120px}
.search{position:relative;margin:4px 0 10px}
.search input{width:100%;height:44px;border:1px solid #dbe0e8;border-radius:12px;padding:0 12px 0 38px;font-size:15px;background:#fff}
.search svg{position:absolute;left:12px;top:13px;width:18px;height:18px;fill:none;stroke:#8a94a6;stroke-width:2}
.note{font-size:12.5px;color:var(--muted);margin:0 2px 10px}
.prod{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.ph{display:flex;gap:12px;padding:12px;align-items:center;cursor:pointer}
.ph img,.ph .noimg{width:76px;height:76px;border-radius:12px;object-fit:contain;background:#f4f5f7;flex:none;border:1px solid #eceef2}
.ph .noimg{display:flex;align-items:center;justify-content:center;color:#9aa4b2;font-weight:700}
.ph b{display:block;font-size:15.5px;color:var(--ink)}
.ph small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ph .from{color:var(--brass);font-weight:700;font-size:13.5px;margin-top:4px}
.ph .cnt{margin-left:auto;background:var(--ink);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:3px 9px;flex:none}
.vars{border-top:1px solid #eef0f3;padding:4px 12px 10px;display:none}
.prod.open .vars{display:block}
.vr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f2f5}
.vr:last-child{border-bottom:0}
.vr .vn{flex:1;min-width:0}
.vr .vn b{font-size:14.5px;color:var(--ink)}
.vr .vn small{display:block;font-size:12.5px;color:var(--muted)}
.vr select{height:34px;border:1px solid #dbe0e8;border-radius:9px;font-size:13px;background:#f8f9fb;padding:0 6px;max-width:150px}
.qty{display:flex;align-items:center;border:1px solid #dbe0e8;border-radius:10px;overflow:hidden;flex:none}
.qty button{width:34px;height:34px;border:0;background:#f4f5f7;font-size:18px;color:var(--ink)}
.qty input{width:46px;height:34px;border:0;text-align:center;font-size:15px;font-weight:600;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:30;box-shadow:0 -6px 20px rgba(14,34,64,.25)}
.bar .t{flex:1}
.bar .t small{display:block;font-size:12px;color:#c9d3e2}
.bar .t b{font-size:19px}
.btn{border:0;border-radius:12px;background:var(--brass);color:#fff;font-weight:700;font-size:15.5px;padding:0 18px;height:46px}
.btn:disabled{opacity:.5}
.btn.light{background:#fff;color:var(--ink);border:1px solid #dbe0e8}
.sheet{position:fixed;inset:0;background:rgba(14,34,64,.45);z-index:40;display:none;align-items:flex-end}
.sheet.on{display:flex}
body.lock{overflow:hidden;position:fixed;left:0;right:0;width:100%}
.sheet .in{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet .in{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 10px;font-size:18px;color:var(--ink)}
.li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px solid #f1f2f5}
.li span{color:var(--muted)}
.otab{width:100%;border-collapse:collapse;font-size:13.5px;margin:4px 0 2px}
.otab th{background:#0e2240;color:#fff;font-weight:600;font-size:12px;text-align:left;padding:7px 6px}
.otab th:first-child{border-radius:8px 0 0 0}.otab th:last-child{border-radius:0 8px 0 0}
.otab td{padding:7px 6px;border-bottom:1px solid #eef0f3;vertical-align:top}
.otab td small{display:block;color:var(--muted);font-size:12px}
.otab .n{text-align:right;white-space:nowrap}
.otab tr:nth-child(even) td{background:#fafbfc}
.hl{background:#fff4d6;border:1.5px solid #e0b453;border-left:5px solid #b4873a;border-radius:10px;padding:10px 12px;margin:10px 0 12px;font-size:13.5px;color:#5c4210;font-weight:600;line-height:1.4}
.hl b{color:#8a5a00}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:10px 0 4px;font-size:14px}
.tot .g{font-size:16.5px;font-weight:700;color:var(--ink)}
label{display:block;font-size:12.5px;font-weight:600;color:#5b6778;margin:10px 0 5px}
.f{width:100%;min-height:44px;border:1px solid #dbe0e8;border-radius:11px;padding:9px 12px;font-size:15px;background:#f8f9fb;font-family:inherit}
.f:focus{outline:0;border-color:var(--brass);background:#fff}
.err{color:var(--bad);font-size:13.5px;min-height:18px;margin-top:8px}
.done{text-align:center;padding:40px 16px}
.done .ok{width:64px;height:64px;border-radius:50%;background:#e6f4ea;color:var(--ok);font-size:34px;line-height:64px;margin:0 auto 12px}
.done h2{color:var(--ink);margin:0 0 6px}
.closed{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;margin-top:20px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.load{text-align:center;color:var(--muted);padding:60px 10px}
.pinmsg{margin:-2px 0 8px;font-size:12.5px;color:#6b7686}.pinmsg.ok{color:#1d7a46;font-weight:600}.pinmsg.wait{color:#8a5a00}.pinmsg.bad{color:#b42318}
</style>
</head>

// google.script.run look-alike: calls the Kishan Ji Google script over HTTPS (no Google sign-in involved)
(function(){
  var API = window.KJP_API || "https://script.google.com/macros/s/AKfycbyIlENNR52Zkstrsh0mfVntghV_hAZRG1MY84caCBygiQ-pvfxrKoq27gunkbOf2_kD/exec";
  function call(fn, args, ok, bad, tries){
    fetch(API, {method:"POST", credentials:"omit", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({fn:fn, args:args})})
      .then(function(r){return r.text()})
      .then(function(t){var j; try{j=JSON.parse(t)}catch(e){throw new Error("bad reply")} if(j&&j.ok)ok&&ok(j.result); else bad&&bad(new Error((j&&j.error)||"Error"))})
      .catch(function(e){ if((tries||0)<1) return setTimeout(function(){call(fn,args,ok,bad,1)},1200); bad&&bad(e) });
  }
  function runner(ok,bad){
    return new Proxy({}, {get:function(_,k){
      if(k==="withSuccessHandler") return function(f){return runner(f,bad)};
      if(k==="withFailureHandler") return function(f){return runner(ok,f)};
      return function(){ call(k, Array.prototype.slice.call(arguments), ok, bad) };
    }});
  }
  window.google = window.google || {}; window.google.script = {run: runner(null,null)};
})();

<script>
var CAT = null, cart = {}, GST = 18;
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function rs(n){n=Number(n||0);return "₹"+n.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function rs0(n){return "₹"+Math.round(Number(n||0)).toLocaleString("en-IN")}
var ME={};
function save(){}
function load(){cart={};try{localStorage.removeItem("kjp_shop_cart");localStorage.removeItem("kjp_shop_me")}catch(e){}}
function key(p,v,box){return p.no+"|"+v.variant+"|"+box}
var MODE=(function(){var q=new URLSearchParams(location.search);var t=(q.get("t")||"").toLowerCase();if(!t&&/retail/i.test(location.pathname))t="r";return t==="r"?"r":"w"})();if(MODE!=="r")MODE="w";
function boxLabel(b){return b==="Open Box"?"Retail":"Wholesale"}
function rateOf(v,box){return box==="Open Box"?v.openRate:v.packRate}
function boxes(v){var b=[];if(v.packRate>0&&MODE!=="r")b.push("Pack Box");if(v.openRate>0&&MODE!=="w")b.push("Open Box");return b}
function totals(){var s=0,n=0;Object.keys(cart).forEach(function(k){var c=cart[k];s+=c.qty*c.rate;n+=c.qty});var g=Math.round((s-s/(1+GST/100))*100)/100;return{sub:s,gst:g,total:s,n:n,lines:Object.keys(cart).length}}
function render(){
  var m=document.getElementById("main");
  if(!CAT.enabled){m.innerHTML='<div class="closed"><h2>Ordering is closed right now</h2><p>Please call or WhatsApp us to place your order.</p>'+(CAT.phone?'<p><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="https://wa.me/'+esc(CAT.phone)+'">WhatsApp us</a></p>':"")+'</div>';return}
  var q=(document.getElementById("q")||{}).value||"";
  var html='<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="q" type="search" placeholder="Search products or sizes" value="'+esc(q)+'" oninput="renderList()"></div><p class="note">Tap a product to choose sizes and quantity. Prices are per piece and include '+GST+'% GST.</p>'+(MODE?'<div class="mode-tag">'+(MODE==="w"?"Wholesale price list":"Retail price list")+'</div>':"")+'<div id="list"></div>';
  m.innerHTML=html;renderList();
}
function renderList(){
  var q=(document.getElementById("q").value||"").toLowerCase().trim(),out="";
  CAT.items.forEach(function(p,pi){
    var txt=(p.no+" "+p.name+" "+p.vars.map(function(v){return v.variant}).join(" ")).toLowerCase();
    if(q&&txt.indexOf(q)<0)return;
    var min=Math.min.apply(null,p.vars.map(function(v){return Math.min.apply(null,boxes(v).map(function(b){return rateOf(v,b)}).concat([1e12]))}));
    var cnt=Object.keys(cart).filter(function(k){return k.split("|")[0]===p.no}).length;
    out+='<div class="prod" id="p'+pi+'"><div class="ph" onclick="toggle('+pi+')">'+(p.image?'<img loading="lazy" src="'+p.image+'" alt="">':'<div class="noimg">'+esc(p.no)+'</div>')+'<div><b>'+esc(p.name)+'</b><small>'+p.vars.length+' size'+(p.vars.length>1?"s":"")+' · '+esc(p.vars.slice(0,3).map(function(v){return v.variant}).join(", "))+(p.vars.length>3?"…":"")+'</small>'+(min<1e12?'<div class="from">from '+rs(min)+'</div>':"")+'</div>'+(cnt?'<span class="cnt">'+cnt+' added</span>':"")+'</div><div class="vars">'+p.vars.map(function(v,vi){
      var bx=boxes(v);if(!bx.length)return"";
      var cur=bx[0];bx.forEach(function(b){if(cart[key(p,v,b)])cur=b});
      var c=cart[key(p,v,cur)],qv=c?c.qty:0;
      return '<div class="vr"><div class="vn"><b>'+esc(v.variant)+'</b><small id="r'+pi+'_'+vi+'">'+rs(rateOf(v,cur))+' each</small></div>'+(bx.length>1?'<select id="b'+pi+'_'+vi+'" onchange="setBox('+pi+','+vi+',this.value)">'+bx.map(function(b){return'<option value="'+b+'"'+(b===cur?" selected":"")+'>'+boxLabel(b)+'</option>'}).join("")+'</select>':'<input type="hidden" id="b'+pi+'_'+vi+'" value="'+cur+'">')+'<div class="qty"><button onclick="step('+pi+','+vi+',-1)">−</button><input inputmode="numeric" id="q'+pi+'_'+vi+'" value="'+(qv||"")+'" placeholder="0" onchange="setQty('+pi+','+vi+',this.value)"><button onclick="step('+pi+','+vi+',1)">+</button></div></div>'}).join("")+'</div></div>';
  });
  document.getElementById("list").innerHTML=out||'<div class="empty">No products match “'+esc(q)+'”.</div>';
  bar();
}
function toggle(pi){document.getElementById("p"+pi).classList.toggle("open")}
function setBox(pi,vi,b){var p=CAT.items[pi],v=p.vars[vi];var old=null;boxes(v).forEach(function(x){if(cart[key(p,v,x)]){old=cart[key(p,v,x)];delete cart[key(p,v,x)]}});document.getElementById("r"+pi+"_"+vi).textContent=rs(rateOf(v,b))+" each";if(old)put(p,v,b,old.qty);else{save();bar()}}
function put(p,v,box,qty){var k=key(p,v,box);qty=Math.max(0,Math.min(100000,Math.floor(Number(qty)||0)));if(!qty)delete cart[k];else cart[k]={no:p.no,name:p.name,variant:v.variant,packType:box,qty:qty,rate:rateOf(v,box)};save();bar()}
function setQty(pi,vi,val){var p=CAT.items[pi],v=p.vars[vi],b=document.getElementById("b"+pi+"_"+vi).value;put(p,v,b,val);var c=cart[key(p,v,b)];document.getElementById("q"+pi+"_"+vi).value=c?c.qty:"";refreshCount(pi)}
function step(pi,vi,d){var p=CAT.items[pi],v=p.vars[vi],b=document.getElementById("b"+pi+"_"+vi).value,c=cart[key(p,v,b)];setQty(pi,vi,(c?c.qty:0)+d*(p.step||1))}
function refreshCount(pi){var p=CAT.items[pi],cnt=Object.keys(cart).filter(function(k){return k.split("|")[0]===p.no}).length,ph=document.querySelector("#p"+pi+" .ph"),el=ph.querySelector(".cnt");if(cnt){if(!el){el=document.createElement("span");el.className="cnt";ph.appendChild(el)}el.textContent=cnt+" added"}else if(el)el.remove()}
function bar(){var t=totals(),b=document.getElementById("bar");b.style.display=t.lines?"flex":"none";document.getElementById("barItems").textContent=t.lines+" item"+(t.lines>1?"s":"")+" · incl. GST";document.getElementById("barTotal").textContent=rs0(t.total)}
function openCart(){
  var t=totals(),me=ME;
  var lines='<table class="otab"><tr><th>Product</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Amount</th></tr>'+Object.keys(cart).map(function(k){var c=cart[k];return'<tr><td><b>'+esc(c.no)+' – '+esc(c.name)+'</b><small>'+esc(c.variant)+' · '+esc(boxLabel(c.packType))+'</small></td><td class="n">'+c.qty+'</td><td class="n">'+rs(c.rate)+'</td><td class="n"><b>'+rs(c.qty*c.rate)+'</b></td></tr>'}).join("")+'</table>';
  document.getElementById("cartIn").innerHTML='<h2>Your order</h2>'+lines+'<div class="tot"><span>Items total</span><b>'+rs(t.sub)+'</b><span>GST included ('+GST+'%)</span><b>'+rs(t.gst)+'</b><span class="g">Estimated total</span><b class="g">'+rs(t.total)+'</b></div><div class="hl">&#9888; <b>Packing charges and shipping cost</b> are not included here. They will be added in the final estimate we share with you.</div>'+
  '<p class="req-note">All fields are required.</p>'+
  '<label>Customer name *</label><input class="f" id="fn" placeholder="Shop or person name" value="'+esc(me.name||"")+'" autocomplete="off">'+
  '<label>Mobile *</label><input class="f" id="fm" inputmode="numeric" maxlength="10" placeholder="10-digit mobile" value="'+esc(me.mobile||"")+'" autocomplete="off">'+
  '<label>Address *</label><input class="f" id="fa" autocomplete="off" placeholder="Shop, street" value="'+esc(me.address||"")+'">'+
  '<label>PIN code *</label><input class="f" id="fp" inputmode="numeric" maxlength="6" placeholder="6 digits" value="'+esc(me.pin||"")+'" autocomplete="off">'+
  '<p class="pinmsg" id="pinMsg">Type the PIN code. City and state fill in by themselves.</p>'+
  '<div class="two"><div><label>City *</label><input class="f" id="fc" value="'+esc(me.city||"")+'" autocomplete="off"></div><div><label>State *</label><input class="f" id="fst" value="'+esc(me.state||"Rajasthan")+'" autocomplete="off"></div></div>'+
  '<div class="err" id="ferr"></div><div style="display:flex;gap:10px;margin-top:6px"><button class="btn light" style="flex:1" onclick="closeCart()">Add more</button><button class="btn" style="flex:1.4" id="sendB" onclick="send()">Send order request</button></div>';
  document.getElementById("cart").classList.add("on");lockBody(true);
  document.querySelectorAll("#cartIn .f").forEach(function(el){el.addEventListener("input",function(){el.classList.remove("bad");keepMe();var e=document.getElementById("ferr");if(e)e.textContent=""})});
  document.getElementById("fp").addEventListener("input",pinChanged);
}
var pinAsked="";
function pinMsg(t,cls){var m=document.getElementById("pinMsg");if(m){m.textContent=t;m.className="pinmsg"+(cls?" "+cls:"")}}
function pinChanged(){
  var el=document.getElementById("fp"),pin=el.value.replace(/\D/g,"").slice(0,6);
  if(el.value!==pin)el.value=pin;
  if(pin.length<6){pinAsked="";pinMsg("Type the PIN code. City and state fill in by themselves.");return}
  if(pin===pinAsked)return;pinAsked=pin;
  if(!/^[1-9]/.test(pin)){pinMsg("Please check the PIN code.","bad");return}
  pinMsg("Finding city and state…","wait");
  pinDirect(pin,function(d){
    if(pin!==document.getElementById("fp").value)return;
    if(d&&(d.ok||d.notFound))return pinShow(pin,d);
    google.script.run.withSuccessHandler(function(r){pinShow(pin,r)}).withFailureHandler(function(){pinMsg("Please type the city and state.","bad")}).lookupPin(pin);
  });
}
function pinDirect(pin,cb){
  var done=false,fin=function(v){if(!done){done=true;cb(v)}};
  setTimeout(function(){fin(null)},7000);
  try{
    fetch("https://api.postalpincode.in/pincode/"+pin).then(function(r){return r.json()}).then(function(j){
      var po=(j&&j[0]&&j[0].PostOffice)||[];
      if(!po.length)return fin(j&&j[0]&&/error/i.test(j[0].Status||"")?{ok:false,notFound:true,error:"PIN code not found. Please check it, or type the city and state."}:null);
      var cnt={},areas=[];
      po.forEach(function(p){var d=String(p.District||"").trim();if(d)cnt[d]=(cnt[d]||0)+1;var n=String(p.Name||"").trim();if(n&&areas.indexOf(n)<0)areas.push(n)});
      var city=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]})[0]||"";
      fin({ok:true,pin:pin,city:city,state:String(po[0].State||"").trim(),areas:areas.slice(0,40)});
    }).catch(function(){fin(null)});
  }catch(e){fin(null)}
}
function pinShow(pin,r){
    if(pin!==document.getElementById("fp").value)return;
    if(!r||!r.ok){pinMsg((r&&r.error)||"Please type the city and state.","bad");return}
    var c=document.getElementById("fc"),st=document.getElementById("fst");
    if(r.city){c.value=r.city;c.classList.remove("bad")}
    if(r.state){st.value=r.state;st.classList.remove("bad")}
    keepMe();pinMsg("✓ "+(r.city?r.city+", ":"")+r.state,"ok");
}
function readMe(){var g=function(id){var e=document.getElementById(id);return e?e.value:""};return{name:g("fn"),mobile:g("fm"),address:g("fa"),area:"",city:g("fc"),state:g("fst"),pin:g("fp"),note:g("fx")}}
function keepMe(){if(!document.getElementById("fn"))return;ME=readMe()}
var lockY=0;
function lockBody(on){var b=document.body;if(on){if(b.classList.contains("lock"))return;lockY=window.scrollY||0;b.style.top=(-lockY)+"px";b.classList.add("lock")}else{if(!b.classList.contains("lock"))return;b.classList.remove("lock");b.style.top="";window.scrollTo(0,lockY)}}
function closeCart(){keepMe();document.getElementById("cart").classList.remove("on");lockBody(false)}
function send(){
  var v=function(id){return document.getElementById(id).value.trim()};
  var me={name:v("fn"),mobile:v("fm").replace(/\D/g,""),address:v("fa"),area:"",city:v("fc"),state:v("fst"),pin:v("fp").replace(/\D/g,"")};
  var e=document.getElementById("ferr");
  var bad=function(id,msg){var el=document.getElementById(id);el.classList.add("bad");el.focus();e.textContent=msg;return false};
  document.querySelectorAll("#cartIn .f.bad").forEach(function(x){x.classList.remove("bad")});
  if(me.name.length<2)return bad("fn","Please enter the customer name.");
  if(!/^[6-9]\d{9}$/.test(me.mobile))return bad("fm","Please enter a 10-digit mobile number.");
  if(me.address.length<3)return bad("fa","Please enter the address.");
  if(me.city.length<2)return bad("fc","Please enter the city.");
  if(me.state.length<2)return bad("fst","Please enter the state.");
  if(!/^\d{6}$/.test(me.pin))return bad("fp","Please enter a 6-digit PIN code.");
  var b=document.getElementById("sendB");b.disabled=true;b.textContent="Sending…";e.textContent="";
  var items=Object.keys(cart).map(function(k){var c=cart[k];return{no:c.no,variant:c.variant,packType:c.packType,qty:c.qty}});
  google.script.run.withSuccessHandler(function(r){
    if(!r||!r.ok){b.disabled=false;b.textContent="Send order request";e.textContent=(r&&r.error)||"Could not send. Please try again.";return}
    cart={};save();closeCart();document.getElementById("bar").style.display="none";
    document.getElementById("main").innerHTML='<div class="done"><div class="ok">✓</div><h2>Thank you, '+esc(me.name)+'!</h2><p>Your order request <b>'+esc(r.id)+'</b> has been sent.</p><p class="note">Estimated total '+rs(r.total)+' incl. GST. We will call you to confirm prices and delivery.</p>'+(CAT.phone?'<p><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="https://wa.me/'+esc(CAT.phone)+'?text='+encodeURIComponent("Hello, I sent order request "+r.id+".")+'">WhatsApp us</a></p>':"")+'<p><button class="btn light" onclick="location.reload()">Place another order</button></p></div>';
    window.scrollTo(0,0);
  }).withFailureHandler(function(err){b.disabled=false;b.textContent="Send order request";e.textContent=(err&&err.message)||"Could not send. Please check your internet and try again."}).submitShopRequest({customer:me,note:"",items:items,stamp:CAT.stamp});
}
load();
var catShown=false;
function gotCat(c){
  catShown=true;
  var raw=JSON.parse(JSON.stringify(c));CAT=c;CAT.raw=raw;GST=Number(c.gst||5);
  CAT.items=(c.items||[]).map(function(p){var q={};for(var k in p)q[k]=p[k];q.vars=p.vars.filter(function(v){return boxes(v).length});return q}).filter(function(p){return p.vars.length});
  var valid={};c.items.forEach(function(p){p.vars.forEach(function(v){boxes(v).forEach(function(b){valid[p.no+"|"+v.variant+"|"+b]=rateOf(v,b)})})});
  Object.keys(cart).forEach(function(k){if(!valid[k])delete cart[k];else cart[k].rate=valid[k]});save();
  render();
}
// show the last price list at once (this phone), then the fresh one from the server
try{var cc=JSON.parse(localStorage.getItem("kjp_shop_cat_"+MODE)||"null");if(cc&&cc.ok&&cc.items)gotCat(cc)}catch(e){}
google.script.run.withSuccessHandler(function(c){
  try{localStorage.setItem("kjp_shop_cat_"+MODE,JSON.stringify(c))}catch(e){}
  if(!c||!c.ok){document.getElementById("main").innerHTML='<div class="closed"><h2>Ordering is not available yet</h2><p>Please call or WhatsApp us to place your order.</p></div>';return}
  if(!catShown||JSON.stringify(c)!==JSON.stringify(CAT.raw))gotCat(c);
}).withFailureHandler(function(){if(!catShown)document.getElementById("main").innerHTML='<div class="closed"><h2>Could not load products</h2><p>Please check your internet and refresh the page.</p></div>'}).getShopCatalog();
</script>
</body>
</html>
